<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Idea Capture — RV 3D</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh;padding:2rem 1rem}
#root{max-width:780px;margin:0 auto}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.sub{font-size:14px;color:#5f5e5a;margin-bottom:1.5rem}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
select,input[type=text],textarea{border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:6px 10px;font-size:14px;background:#fff;color:#1a1a18;outline:none;font-family:inherit}
select:focus,input:focus,textarea:focus{border-color:#378add;box-shadow:0 0 0 3px rgba(55,138,221,0.15)}
textarea{width:100%;resize:vertical;min-height:80px}
.btn{border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:7px 14px;font-size:14px;background:#fff;color:#1a1a18;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:#f1efe8}
.btn-primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
.btn-primary:hover{background:#333}
.btn-danger{color:#a32d2d;border-color:rgba(163,45,45,0.3)}
.btn-danger:hover{background:#fcebeb}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.card-title{font-size:15px;font-weight:500;line-height:1.4}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px}
.desc{font-size:13px;color:#5f5e5a;line-height:1.5}
.card-date{font-size:11px;color:#888780;margin-top:8px}
.actions{display:flex;gap:6px;flex-shrink:0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:#fff;border-radius:16px;padding:1.5rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:500;margin-bottom:1.25rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;color:#5f5e5a;margin-bottom:4px}
.field select,.field input,.field textarea{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.empty{text-align:center;padding:3rem 1rem;color:#5f5e5a;font-size:14px}
.count{font-size:13px;color:#5f5e5a}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const CATS=['RV 3D','Consulting','Motorhome','General'];
const STATUSES=['New','Exploring','Parked','Done'];
const PRIORITIES=['High','Medium','Low'];
const PRI_BG={High:'#FAECE7',Medium:'#FAEEDA',Low:'#EAF3DE'};
const PRI_TX={High:'#993C1D',Medium:'#854F0B',Low:'#3B6D11'};
const STA_BG={New:'#E6F1FB',Exploring:'#EEEDFE',Parked:'#F1EFE8',Done:'#E1F5EE'};
const STA_TX={New:'#185FA5',Exploring:'#3C3489',Parked:'#5F5E5A',Done:'#0F6E56'};
const CAT_BG={'RV 3D':'#FBEAF0',Consulting:'#E6F1FB',Motorhome:'#EAF3DE',General:'#F1EFE8'};
const CAT_TX={'RV 3D':'#72243E',Consulting:'#185FA5',Motorhome:'#27500A',General:'#5F5E5A'};
const LS='rv3d_ideas';
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=d=>new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const blank={title:'',category:'RV 3D',description:'',priority:'Medium',status:'New'};

function Badge({text,bg,tx}){return <span className="badge" style={{background:bg,color:tx}}>{text}</span>}

function Modal({idea,onSave,onClose}){
  const[f,setF]=useState(idea||blank);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  return(
    <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal">
        <h2>{idea?'Edit idea':'New idea'}</h2>
        <div className="field"><label>Title</label><input value={f.title} onChange={set('title')} placeholder="One-line summary"/></div>
        <div className="field"><label>Category</label><select value={f.category} onChange={set('category')}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="field"><label>Description</label><textarea value={f.description} onChange={set('description')} placeholder="Details, context, inspiration..."/></div>
        <div className="grid2">
          <div className="field"><label>Priority</label><select value={f.priority} onChange={set('priority')}>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select></div>
          <div className="field"><label>Status</label><select value={f.status} onChange={set('status')}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
        </div>
        <div className="row-btns">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>f.title.trim()&&onSave(f)}>Save idea</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[ideas,setIdeas]=useState(()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch{return[]}});
  const[modal,setModal]=useState(null);
  const[fCat,setFCat]=useState('All');
  const[fSta,setFSta]=useState('All');
  const[fPri,setFPri]=useState('All');
  const[sort,setSort]=useState('newest');
  useEffect(()=>localStorage.setItem(LS,JSON.stringify(ideas)),[ideas]);
  const save=f=>{
    if(modal==='new')setIdeas(p=>[{...f,id:uid(),date:Date.now()},...p]);
    else setIdeas(p=>p.map(i=>i.id===modal.id?{...i,...f}:i));
    setModal(null);
  };
  const del=id=>{if(confirm('Delete this idea?'))setIdeas(p=>p.filter(i=>i.id!==id))};
  const list=useMemo(()=>{
    let r=ideas;
    if(fCat!=='All')r=r.filter(i=>i.category===fCat);
    if(fSta!=='All')r=r.filter(i=>i.status===fSta);
    if(fPri!=='All')r=r.filter(i=>i.priority===fPri);
    return[...r].sort((a,b)=>sort==='newest'?b.date-a.date:sort==='oldest'?a.date-b.date:PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority));
  },[ideas,fCat,fSta,fPri,sort]);
  return(
    <>
      <div className="topbar">
        <div><h1>Idea capture</h1><p className="sub">RV 3D · Consulting · Motorhome</p></div>
        <button className="btn btn-primary" onClick={()=>setModal('new')}>+ New idea</button>
      </div>
      <div className="filters">
        <select value={fCat} onChange={e=>setFCat(e.target.value)}><option>All</option>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        <select value={fSta} onChange={e=>setFSta(e.target.value)}><option>All</option>{STATUSES.map(s=><option key={s}>{s}</option>)}</select>
        <select value={fPri} onChange={e=>setFPri(e.target.value)}><option>All</option>{PRIORITIES.map(p=><option key={p}>{p}</option>)}</select>
        <select value={sort} onChange={e=>setSort(e.target.value)}>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="priority">By priority</option>
        </select>
        <span className="count">{list.length} idea{list.length!==1?'s':''}</span>
      </div>
      {list.length===0
        ?<div className="empty">{ideas.length===0?'No ideas yet — add your first one.':'No ideas match these filters.'}</div>
        :list.map(i=>(
          <div className="card" key={i.id}>
            <div className="card-top">
              <span className="card-title">{i.title}</span>
              <div className="actions">
                <button className="btn btn-sm" onClick={()=>setModal(i)}>Edit</button>
                <button className="btn btn-sm btn-danger" onClick={()=>del(i.id)}>Delete</button>
              </div>
            </div>
            <div className="badges">
              <Badge text={i.category} bg={CAT_BG[i.category]} tx={CAT_TX[i.category]}/>
              <Badge text={i.priority} bg={PRI_BG[i.priority]} tx={PRI_TX[i.priority]}/>
              <Badge text={i.status} bg={STA_BG[i.status]} tx={STA_TX[i.status]}/>
            </div>
            {i.description&&<p className="desc">{i.description}</p>}
            <p className="card-date">{fmt(i.date)}</p>
          </div>
        ))
      }
      {modal&&<Modal idea={modal==='new'?null:modal} onSave={save} onClose={()=>setModal(null)}/>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
